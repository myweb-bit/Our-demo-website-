<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Dr. Mumtaz's Smile Care</title>
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <!-- ================= 1. LOGIN MODAL ================= -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl border border-slate-100 text-center">
      <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-extrabold text-slate-900">Clinic Admin Login</h2>
      <p class="text-xs text-slate-500 mt-1">Dr. Mumtaz's Smile Care Dental Clinic</p>
      
      <div class="mt-6">
        <label class="block text-left text-xs font-bold text-slate-700 mb-1">Enter Secret PIN</label>
        <input type="password" id="admin-pin" placeholder="Default PIN: 1234" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-center text-lg font-bold tracking-widest focus:outline-blue-600">
        <p id="login-error" class="text-xs text-red-500 font-semibold mt-2 hidden">Galat PIN! Dubara try karein.</p>
        <button onclick="checkLogin()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/30">
          Login Dashboard
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 2. MAIN ADMIN DASHBOARD ================= -->
  <div id="dashboard" class="hidden">
    <!-- Top Nav -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white text-base">
            <i class="fa-solid fa-tooth"></i>
          </div>
          <div>
            <h1 class="text-sm font-bold text-slate-900 leading-tight">Smile Care Control Panel</h1>
            <p class="text-[10px] text-emerald-600 font-bold">● Connected to Firebase</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <a href="index.html" target="_blank" class="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> View Live Site
          </a>
          <button onclick="logout()" class="text-xs text-red-600 font-bold hover:bg-red-50 px-2.5 py-1.5 rounded-lg transition">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">

      <!-- Alert Message Box -->
      <div id="status-alert" class="hidden p-4 rounded-2xl text-xs font-bold transition"></div>

      <!-- SECTION 1: CLINIC TIMING & INFO -->
      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
        <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
          <i class="fa-solid fa-clock text-blue-600 text-base"></i>
          <h2 class="font-bold text-slate-900 text-sm">Clinic Timings & Contact</h2>
        </div>
        
        <div class="grid sm:grid-cols-2 gap-4 text-xs font-semibold text-slate-700">
          <div>
            <label class="block mb-1">Mon - Sat Timing</label>
            <input type="text" id="cfg_mon_sat" value="9:00 AM - 8:00 PM" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
          <div>
            <label class="block mb-1">Sunday Timing</label>
            <input type="text" id="cfg_sun" value="9:00 AM - 2:00 PM" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
          <div>
            <label class="block mb-1">WhatsApp / Calling Number</label>
            <input type="text" id="cfg_phone" value="+919199409404" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
          <div>
            <label class="block mb-1">Address / Landmark</label>
            <input type="text" id="cfg_address" value="Babunia Road, Near Police Adda No-2, Siwan" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
        </div>
      </div>

      <!-- SECTION 2: PHOTO UPLOAD (IMGBB API) -->
      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
        <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
          <i class="fa-solid fa-camera text-blue-600 text-base"></i>
          <h2 class="font-bold text-slate-900 text-sm">Upload Clinic / Doctor Photo (ImgBB Connected)</h2>
        </div>
        
        <div class="grid sm:grid-cols-2 gap-6 items-center">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2">Choose Image from Phone / Computer</label>
            <input type="file" id="img_file_input" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            <button onclick="uploadToImgBB()" id="upload_btn" class="mt-3 inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 px-4 rounded-xl shadow-md transition">
              <i class="fa-solid fa-cloud-arrow-up"></i> Upload & Set Live
            </button>
            <p id="upload-status" class="text-[11px] font-semibold text-slate-500 mt-2"></p>
          </div>
          <div class="text-center p-3 bg-slate-50 border border-slate-200 rounded-2xl">
            <p class="text-[11px] font-bold text-slate-400 mb-2">Current Active Image</p>
            <img id="active_preview" src="https://via.placeholder.com/150?text=Clinic+Photo" alt="Preview" class="w-24 h-24 object-cover rounded-xl mx-auto border border-slate-200">
            <input type="text" id="cfg_photo_url" readonly class="mt-2 w-full text-[10px] bg-white p-1.5 rounded border border-slate-200 text-slate-500 text-center">
          </div>
        </div>
      </div>

      <!-- SECTION 3: TREATMENT RATES LIST -->
      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
        <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
          <i class="fa-solid fa-indian-rupee-sign text-blue-600 text-base"></i>
          <h2 class="font-bold text-slate-900 text-sm">Treatment Fee / Rates Management</h2>
        </div>

        <div class="grid sm:grid-cols-2 gap-4 text-xs font-semibold text-slate-700">
          <div>
            <label class="block mb-1">Checkup / Consultation Fee</label>
            <input type="text" id="rate_consult" value="₹150 - ₹200" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
          <div>
            <label class="block mb-1">Ultrasonic Teeth Cleaning (Scaling)</label>
            <input type="text" id="rate_clean" value="₹600 - ₹1,000" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
          <div>
            <label class="block mb-1">Tooth Extraction</label>
            <input type="text" id="rate_extract" value="₹300 - ₹500" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
          <div>
            <label class="block mb-1">Root Canal Treatment (RCT)</label>
            <input type="text" id="rate_rct" value="₹1,500 - ₹2,500" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
          <div>
            <label class="block mb-1">Ceramic Cap / Crown</label>
            <input type="text" id="rate_crown" value="₹2,000 - ₹4,500" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-blue-600">
          </div>
        </div>
      </div>

      <!-- SAVE BUTTON -->
      <div class="sticky bottom-4 z-30">
        <button onclick="saveAllChangesToFirebase()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-2xl shadow-xl shadow-blue-600/30 flex items-center justify-center gap-2 text-sm transition">
          <i class="fa-solid fa-floppy-disk text-base"></i> Save All Changes Live to Website
        </button>
      </div>

    </main>
  </div>

  <!-- ================= FIREBASE & IMGBB LOGIC SCRIPT ================= -->
  <script>
    // 1. Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCu55LB6BOBEAyj13WfErwxoouwy8S74X0",
      authDomain: "sahab-91906.firebaseapp.com",
      projectId: "sahab-91906",
      storageBucket: "sahab-91906.firebasestorage.app",
      messagingSenderId: "637023462679",
      appId: "1:637023462679:web:ec21986068bc143324c352"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const IMGBB_API_KEY = "8104f8ac745d8dc4621b9d758844b418";

    // 2. Simple PIN Login
    const CORRECT_PIN = "1234";

    function checkLogin() {
      const pin = document.getElementById("admin-pin").value;
      if (pin === CORRECT_PIN) {
        document.getElementById("login-modal").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        loadLiveFirebaseData();
      } else {
        document.getElementById("login-error").classList.remove("hidden");
      }
    }

    function logout() {
      document.getElementById("dashboard").classList.add("hidden");
      document.getElementById("login-modal").classList.remove("hidden");
      document.getElementById("admin-pin").value = "";
    }

    // 3. Load Existing Data from Firebase
    function loadLiveFirebaseData() {
      showAlert("Firebase se data fetch ho raha hai...", "bg-blue-100 text-blue-800");
      db.ref("clinic_data").once("value", (snapshot) => {
        const d = snapshot.val();
        if (d) {
          if (d.mon_sat) document.getElementById("cfg_mon_sat").value = d.mon_sat;
          if (d.sun) document.getElementById("cfg_sun").value = d.sun;
          if (d.phone) document.getElementById("cfg_phone").value = d.phone;
          if (d.address) document.getElementById("cfg_address").value = d.address;
          if (d.photo_url) {
            document.getElementById("cfg_photo_url").value = d.photo_url;
            document.getElementById("active_preview").src = d.photo_url;
          }
          if (d.rates) {
            if (d.rates.consult) document.getElementById("rate_consult").value = d.rates.consult;
            if (d.rates.clean) document.getElementById("rate_clean").value = d.rates.clean;
            if (d.rates.extract) document.getElementById("rate_extract").value = d.rates.extract;
            if (d.rates.rct) document.getElementById("rate_rct").value = d.rates.rct;
            if (d.rates.crown) document.getElementById("rate_crown").value = d.rates.crown;
          }
          showAlert("Latest data loaded successfully!", "bg-emerald-100 text-emerald-800");
        } else {
          hideAlert();
        }
      });
    }

    // 4. ImgBB Upload Function
    async function uploadToImgBB() {
      const fileInput = document.getElementById("img_file_input");
      const status = document.getElementById("upload-status");
      const btn = document.getElementById("upload_btn");

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Pehle koi image select karein!");
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("image", file);

      status.innerText = "Uploading to ImgBB...";
      status.className = "text-[11px] font-semibold text-blue-600 mt-2";
      btn.disabled = true;

      try {
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const json = await res.json();

        if (json.success) {
          const directUrl = json.data.url;
          document.getElementById("cfg_photo_url").value = directUrl;
          document.getElementById("active_preview").src = directUrl;
          status.innerText = "✓ Upload successful! Ab niche 'Save All Changes' dabayein.";
          status.className = "text-[11px] font-semibold text-emerald-600 mt-2";
        } else {
          status.innerText = "Upload fail ho gaya: " + json.error.message;
          status.className = "text-[11px] font-semibold text-red-600 mt-2";
        }
      } catch (err) {
        status.innerText = "Error: " + err.message;
        status.className = "text-[11px] font-semibold text-red-600 mt-2";
      } finally {
        btn.disabled = false;
      }
    }

    // 5. Save Everything to Firebase Realtime Database
    function saveAllChangesToFirebase() {
      const payload = {
        mon_sat: document.getElementById("cfg_mon_sat").value,
        sun: document.getElementById("cfg_sun").value,
        phone: document.getElementById("cfg_phone").value,
        address: document.getElementById("cfg_address").value,
        photo_url: document.getElementById("cfg_photo_url").value || "",
        rates: {
          consult: document.getElementById("rate_consult").value,
          clean: document.getElementById("rate_clean").value,
          extract: document.getElementById("rate_extract").value,
          rct: document.getElementById("rate_rct").value,
          crown: document.getElementById("rate_crown").value
        },
        last_updated: new Date().toISOString()
      };

      showAlert("Saving to Firebase...", "bg-blue-100 text-blue-800");

      db.ref("clinic_data").set(payload, (error) => {
        if (error) {
          showAlert("Error saving data: " + error.message, "bg-red-100 text-red-800");
        } else {
          showAlert("🎉 Sabhi changes live website par update ho gaye!", "bg-emerald-100 text-emerald-800");
          setTimeout(hideAlert, 4000);
        }
      });
    }

    function showAlert(msg, classes) {
      const el = document.getElementById("status-alert");
      el.className = `p-4 rounded-2xl text-xs font-bold transition block ${classes}`;
      el.innerText = msg;
    }

    function hideAlert() {
      document.getElementById("status-alert").classList.add("hidden");
    }
  </script>
</body>
</html>
